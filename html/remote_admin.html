  <body class="claro">

    <div id="appLayout" class="demoLayout" data-dojo-type="dijit/layout/BorderContainer" data-dojo-props="design: 'headline'">
      <div class="edgePanel" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region: 'top'">
	<div>
	  <table class="layoutTable">
	    <tr>
	      <td><table>
		  <tr>
		    <td><img src="https://ls-cat.org/ls2.png" width="32" alt="LS-CAT Logo"/></td>
		    <td>
		      <div class="lsTitle">LS-CAT</div><div class="lsSubTitle">Life Sciences Collaborative Access Team</div>
		    </td>
		  </tr>
	      </table></td>
	      <td class="userStatusCell">
		<div id="userStatus">
		  Login
		</div>
	      </td>
	    </tr>
	  </table>
	</div>
      </div>
      <div class="centerPanel" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region: 'center'">
	<table id="statusTable">
	</table>

    <!-- Load Dojo	-->

    <script src="//ajax.googleapis.com/ajax/libs/dojo/1.9.1/dojo/dojo.js" data-dojo-config="has:{'dojo-debugging-messages':true}, foo: 'bar', async: 'true', isDebug: 1, cacheBust: 'true'"></script>
 
    <script>
      
var esafCombo;
var esafComboStore;

// Require the registry, parser, Dialog, and wait for domReady
//, "dojo/domReady!"]

require(["dijit/registry", "dojo/parser", "dojo/json", "dojo/_base/config", "dojo/data/ObjectStore", "dojo/store/Memory", "dijit/Dialog", "dijit/form/Form", "dijit/form/ComboBox",
	 "dijit/form/Button", "dijit/form/DropDownButton", "dijit/TooltipDialog", "dijit/layout/BorderContainer", "dijit/layout/TabContainer", "dijit/layout/ContentPane"]
	, function(registry, parser, JSON, config, ObjectStore, Memory, Dialog, Form, ComboBox) {



	    // Explicitly parse the page
	    parser.parse();

	    esafComboStore = new Memory();
	    esafCombo = new ComboBox( {store: esafComboStore, searchAttr: "name", style: "width: 350px;"});


	});

</script>

    <script type="text/javascript">

var ESAFs = new Array();
var stnkeys = new Array();
var esafs;

function loginESAF( evt, stnkey) {

    var frm = dijit.registry.byId( 'esafSelectForm'+stnkey);
    esafCombo.placeAt(frm, "first");
}

function parseESAF( evt) {
    var xmlhttp = evt.currentTarget;

    if (xmlhttp.readyState==4 && xmlhttp.status==200) {
	esafs = xmlhttp.responseXML.documentElement.getElementsByTagName("esaf");
	for( var i=0; i<esafs.length; i++) {
	    var id;
	    var n;
	    n = unescape(esafs[i].getAttribute("id") + "%a0%a0%a0%a0%a0" + esafs[i].getAttribute("startdate") + "%a0%a0%a0%a0%a0" + esafs[i].getAttribute("piln") + ", " + esafs[i].getAttribute("pifn"));
	    id = esafs[i].getAttribute("id")
	    esafComboStore.add({id: id, name: n});
	}
    }
}

function parseLogout( evt) {
    var xmlhttp = evt.currentTarget;

    if( xmlhttp.readState==4 && xmlhttp.status==200) {
	loadXMLDoc( "checkxml", null, parseCheckXml);
    }
}

function logout( evt) {
    loadXMLDoc( "logout", null, parseLogout);
}

function parseCheckXml( evt) {
    var xmlhttp = evt.currentTarget;

    if( xmlhttp.readyState==4 && xmlhttp.status==200) {
	var logincheck = xmlhttp.responseXML.documentElement.getElementsByTagName("logincheck");
	var uid = logincheck[0].getAttribute("uid");
	var userStatus = document.getElementById("userStatus");
	if( !uid) {
	    var zz = ""
	    zz += '<div data-dojo-type="dijit/form/DropDownButton">'
	    zz +=   '<span>Please Log In</span>'
	    zz +=   '<div data-dojo-type="dijit/TooltipDialog" id="userLoginDialog">'
	    zz +=     '<form data-dojo-type="dijit/form/Form" id="userLoginForm">'
	    zz +=       '<table>'
	    zz +=         '<tr>'
	    zz +=             '<td class="formLabel">Username:</td>'
	    zz +=             '<td><input type="text" name="u" value="" data-dojo-type="dijit/form/TextBox" data-dojo-props="trim:true" id="username"/></td>'
	    zz +=         '</tr><tr>'
	    zz +=           '<td class="formLabel">Password:</td>'
	    zz +=           '<td><input type="password" name="p" value="" data-dojo-type="dijit/form/TextBox" data-dojo-props="trim:true" id="password"/></td>'
	    zz +=         '</tr><tr>'
	    zz +=           '<td colspan="2" style="text-align: center;">'
	    zz +=             '<div data-dojo-type="dijit/form/Button">'
	    zz +=               'Log In'
	    zz +=             '</div>'
	    zz +=           '</td>'
	    zz +=         '</tr></table>'
	    zz +=     '</form>'
	    zz +=   '</div>'
	    zz += '</div>'
	    userStatus.innerHTML = zz
	} else {
	    var zz = ""
	    zz += '<div data-dojo-type="dijit/form/DropDownButton">'
	    zz +=   '<span>'+uid+'</span>'
	    zz +=   '<div data-dojo-type="dijit/TooltipDialog">'
	    zz +=       '<button data-dojo-type="dijit/form/Button" data-dojo-props="onClick=doAlert">'
	    zz +=         'Log Out'
	    zz +=       '</button>'
	    zz +=   '</div>'
	    zz += '</div>'
	    userStatus.innerHTML = zz
	}
    }
}

function parseStnStatus( evt) {
    var xmlhttp = evt.currentTarget;
    if (xmlhttp.readyState==4 && xmlhttp.status==200) {
	
	var stations = xmlhttp.responseXML.documentElement.getElementsByTagName("station");
	
	
	for( var i=0; i<stations.length; i++) {
	    var stnkey = stations[i].getAttribute("stnkey");
	    localStorage[stnkey+".stnname"] = stations[i].getAttribute("stnname");
	    var kvs = stations[i].getElementsByTagName("kvpair")
	}
	
	var stbl = document.getElementById("statusTable");
	var cap  = stbl.createCaption();
	cap.innerHTML = "<b>LS-CAT Station Status</b>";
	stbl.style.width = "1024px";
	var thead = stbl.createTHead();
	var row   = thead.insertRow( -1);
	var cell;
	
	cell = row.insertCell(-1);
	cell.innerHTML = "Station";
	for( var i=0; i<stations.length; i++) {
	    cell = row.insertCell(-1);
	    cell.innerHTML = stations[i].getAttribute("stnname");
	    if( stations[i].getAttribute("stnkey"))
		stnkeys[i] = stations[i].getAttribute("stnkey");
	}
	
	row  = stbl.insertRow( -1);
	row.className = "oddRow";
	cell = row.insertCell(-1);
	cell.innerHTML = "ESAF";
	for( var i=0; i<stations.length; i++) {
	    cell = row.insertCell(-1);
	    kvpairs = stations[i].getElementsByTagName("kvpair");
	    for( var j=0; j<kvpairs.length; j++) {
		if( kvpairs[j].getAttribute("name") == "esaf") {
		    cell.setAttribute( "stnkey", stnkeys[i]);
		    cell.setAttribute( "esaf", kvpairs[j].getAttribute("value"));
		    ESAFs[stnkeys[i]] = cell;
		    var esafValue = kvpairs[j].getAttribute("value");
		    if( !esafValue || esafValue=="null")
			esafValue = "";

		    if( esafValue != "") {
			var zz = '<div data-dojo-type="dijit/form/DropDownButton">';
			zz +=      '<span>'+esafValue+'</span>';
			zz +=      '<div data-dojo-type="dijit/TooltipDialog">'
			zz +=        '<form>';
			zz +=          '<button data-dojo-type="dijit/form/Button">Log Out</button>'
			zz +=        '</form>';
			zz +=      '</div>';
			zz +=    '</div>';
			cell.innerHTML = zz;
		    } else {
			var zz = '<div data-dojo-type="dijit/form/DropDownButton"  onclick="loginESAF(event,'+stnkeys[i]+');">';
			zz +=      '<span>Log In</span>';
			zz +=      '<div data-dojo-type="dijit/TooltipDialog" style="width: 400px;">';
			zz +=        '<form id="esafSelectForm'+stnkeys[i]+'" data-dojo-type="dijit/form/Form">';
			zz +=          '<button data-dojo-type="dijit/form/Button">Assign ESAF to Station '+localStorage[stnkeys[i]+".stnname"]+'</Button>';
			zz +=        '</form>';
			zz +=      '</div>';
			zz +=    '</div>';
			cell.innerHTML = zz;
		    }

		    break;
		}
	    }
	}
	
	row       = stbl.insertRow( -1);
	row.className = "evenRow";
	cell = row.insertCell(-1);
	cell.innerHTML = "State";
	for( var i=0; i<stations.length; i++) {
	    cell = row.insertCell(-1);
	    kvpairs = stations[i].getElementsByTagName("kvpair");
	    for( var j=0; j<kvpairs.length; j++) {
		if( kvpairs[j].getAttribute("name") == "label") {
		    cell.innerHTML = kvpairs[j].getAttribute("value");	      
		    break;
		}
	    }
	}
    }
}

function loadXMLDoc( theUrl, theSobj, parseDocFunc) {
    var xmlhttp;
    if (window.XMLHttpRequest) {// code for IE7+, Firefox, Chrome, Opera, Safari
	xmlhttp=new XMLHttpRequest();
    } else {// code for IE6, IE5
	xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
    }
    
    xmlhttp.onreadystatechange=parseDocFunc;
    
    
    var sobject = "";
    
    xmlhttp.open("POST", theUrl, true);
    xmlhttp.setRequestHeader("Content-type","application/x-www-form-urlencoded");
    xmlhttp.send(theSobj);
}

// loadXMLDoc( "esafs",     null, parseESAF);
// loadXMLDoc( "stnstatus", null, parseStnStatus);

loadXMLDoc( "checkxml", null, parseCheckXml);

	    
    </script>
