<IfModule mod_ssl.c>
  # Redirects HTTP to HTTPS
  <VirtualHost *:80>
      ServerName ls-cat.org
      Redirect permanent "/" "https://ls-cat.org/"
  </VirtualHost>


  <VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ls-cat.org.crt
    SSLCertificateKeyFile /etc/ssl/private/ls-cat.org.key

    ServerName ls-cat.org
    ServerAlias ls-cat.org ls.aps.anl.gov *.ls-cat.org *.ls.aps.anl.gov

    TraceEnable off
    DocumentRoot /var/www/ls-cat.org
    AddType text/html .php
    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml
    DirectoryIndex index.html
    AddHandler php7-script .php
    XBitHack on

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    RewriteEngine on
    RewriteCond %{REQUEST_METHOD}  !^(GET|POST)$
    RewriteRule .* - [F]
    RewriteRule .*\.svn             -       [F]
    RewriteRule   ^/$               /index.html [R]
    RewriteRule   ^/(.+)/$          /$1
    RewriteRule   ^/positions       /html/positions.html
    RewriteRule   ^/([^/]+)\.html$  /html/$1.html
    RewriteRule   ^/([^/]+)\.xhtml$  /xhtml/$1.xhtml
    RewriteRule   ^/([^/]+)\.shtml$  /shtml/$1.shtml
    RewriteRule   ^/([^/]+)\.php$   /php/$1.php
    RewriteRule   ^/([^/]+)\.xml$   /xml/$1.xml
    RewriteRule   ^/([^/]+)\.swf$   /swf/$1.swf
    RewriteRule   ^/([^/]+)\.swz$   /swz/$1.swz
    RewriteRule   ^/([^/]+)\.site$  /site/$1.site
    RewriteRule   ^/([^/]+)\.xsl$   /xsl/$1.xsl
    RewriteRule   ^/([^/]+)\.css$   /css/$1.css
    RewriteRule   ^/([^/]+)\.iso$   /iso/$1.iso
    RewriteRule   ^/([^/]+)\.cfg$   /cfg/$1.cfg
    RewriteRule   ^/([^/]+)\.pdf$   /pdf/$1.pdf
    RewriteRule   ^/([^/]+)\.txt$   /txt/$1.txt
    RewriteRule   ^/([^/]+)\.doc$   /doc/$1.doc
    RewriteRule   ^/([^/]+)\.dot$   /dot/$1.dot
    RewriteRule   ^/([^/]+)\.dwg$   /dwg/$1.dwg
    RewriteRule   ^/([^/]+)\.jpg$   /images/$1.jpg
    RewriteRule   ^/([^/]+)\.jpeg$  /images/$1.jpeg
    RewriteRule   ^/([^/]+)\.gif$   /images/$1.gif
    RewriteRule   ^/([^/]+)\.ico$   /images/$1.ico
    RewriteRule   ^/([^/]+)\.png$   /images/$1.png
    RewriteRule   ^/([^/]+)\.js$    /js/$1.js
    RewriteRule   ^/([^/]+)\.zip$    /zip/$1.zip
    RewriteRule   ^/([^/]+)\.flv$    /movies/$1.flv
    RewriteRule   ^/([^/]+)\.f4v$    /movies/$1.f4v
    RewriteRule   ^/([^/]+)\.mp4$    /movies/$1.mp4
    RewriteRule   ^/([^/]+)\.m4v$    /movies/$1.m4v
    RewriteRule   ^/([^/]+)\.m4a$    /movies/$1.m4a
    RewriteRule   ^/([^/]+)\.mov$    /movies/$1.mov
    RewriteRule   ^/([^/]+)\.mkv$    /movies/$1.mkv
    RewriteRule   ^/([^/]+)\.ogg$    /movies/$1.ogg
    RewriteRule   ^/([^/]+)\.pptx    /pptx/$1.pptx
    RewriteRule   ^/gifs/(.+)$       /images/$1

    RewriteRule   ^/([^/\.]+)$       /php/$1.php

    <Directory /var/www/ls-cat.org>
        Options FollowSymLinks Includes
        AllowOverride None
        Require all granted
    </Directory>

    <Directorymatch "^/.*/\.git/">
      Order deny,allow
      Deny from all
    </Directorymatch>
    
    <Directorymatch "^/install/">
      Order deny,allow
      Deny from all
    </Directorymatch>

  </VirtualHost>
</IfModule>
