<IfModule mod_ssl.c>
  # Redirects HTTP to HTTPS
  <VirtualHost *:80>
      ServerName ls-cat.org
      Redirect permanent "/" "https://ls-cat.org/"
  </VirtualHost>


  <VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ls-cat.org.crt
    SSLCertificateKeyFile /etc/ssl/private/ls-cat.org.key

    ServerName ls-cat.org
    ServerAlias ls-cat.org ls.aps.anl.gov *.ls-cat.org *.ls.aps.anl.gov

    # Improves performance, ok because the APS only allows us to use IPv4.
    # Warning: Should not be used on Linux when using IPv6.
    EnableSendfile On

    TraceEnable off
    
    DirectoryIndex index.html
    AddHandler php8-script .php
    AddType text/html .php
    XBitHack on

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src: 'self'"

    DocumentRoot /var/www/ls-cat.org/assets
    <Directory /var/www/ls-cat.org/assets>
        Options Includes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine on

    # Forbid any request other than GET or HEAD.
    RewriteCond	  %{REQUEST_METHOD}  !^(GET|HEAD)$
    RewriteRule   .* - [F]

    # 1. Strip trailing slashes.
    RewriteRule ^/([^/]+)[/+]$ /$1
    
    # 2. If the file ext is that of a known image, audio, or video type, look
    #    under "images", "audio", or "video" respectively.
    RewriteRule ^/([^/]+)\.(png|jpe?g|gif|tiff|svg|ico|bmp)$ /images/$1.$2
    RewriteRule ^/([^/]+)\.(mp3|m4a|aac|alac|flac|wav|ogg)$ /audio/$1.$2
    RewriteRule ^/([^/]+)\.(mp4|mov|webm)$ /video/$1.$2
    
    # 3. If the file extension is anything else, e.g. html/css/js/php/txt, then
    #    the content is in the corresponding subdir.
    #    Example: /contacts.html -> /html/contacts.html
    RewriteRule ^/([^/]+)\.(.+)$ /$2/$1.$2
    
    # 4. If there is no file extension or directory, assume the request is for
    #    some dynamic content. All the dynamic content is php.
    RewriteRule ^/([^/\.]+)$ /php/$1.php
  </VirtualHost>
</IfModule>
