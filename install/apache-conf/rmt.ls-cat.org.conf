<IfModule mod_ssl.c>
  <VirtualHost *:80>
      ServerName rmt.ls-cat.org
      Redirect permanent "/" "https://ls-cat.org/login.html"
  </VirtualHost>

  <VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ls-cat.org.crt
    SSLCertificateKeyFile /etc/ssl/private/ls-cat.org.key
    
    ServerName rmt.ls-cat.org
    Redirect permanent "/" "https://ls-cat.org/login.html"
  </VirtualHost>
</IfModule>
